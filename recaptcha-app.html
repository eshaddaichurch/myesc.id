<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifikasi Keamanan</title>
<script src="https://www.google.com/recaptcha/api.js?render=6Lee0W8tAAAAABG8ld1IaYBdmW2IN0xM3lIH5NON"></script>
<style>
  body { margin: 0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #555; background: #fff; }
</style>
</head>
<body>
<p>Memverifikasi keamanan...</p>
<script>
  function kirim(obj) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(obj));
  }
  if (typeof grecaptcha === 'undefined') {
    kirim({ type: 'error' });
  } else {
    grecaptcha.ready(function () {
      grecaptcha.execute('6Lee0W8tAAAAABG8ld1IaYBdmW2IN0xM3lIH5NON', { action: 'registrasi' })
        .then(function (token) { kirim({ type: 'token', token: token }); })
        .catch(function () { kirim({ type: 'error' }); });
    });
  }
</script>
</body>
</html>
